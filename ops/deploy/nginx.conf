# ============================================================
# 贝壳管理系统 · Nginx 生产配置
# 适用于：Ubuntu 22.04 / Debian 12
# 放置路径：/etc/nginx/sites-available/beike
# 启用方式：sudo ln -s /etc/nginx/sites-available/beike /etc/nginx/sites-enabled/
# ============================================================

upstream beike_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name _;                              # 替换为实际域名，如 beike.yourdomain.com

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 前端静态文件托管
    location / {
        root /var/www/beike-web;
        index index.html;
        try_files $uri $uri/ /index.html;       # 解决 React Router 刷新 404
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://beike_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 文件上传大小限制
        client_max_body_size 50m;
    }

    # 健康检查（可选，K8s/监控用）
    location /health {
        proxy_pass http://beike_backend/actuator/health;
        access_log off;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

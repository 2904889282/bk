# ============================================================
# Nginx Site Config — 贝壳管理平台 边缘网关
# 路由规则:  /api/* → Spring Cloud Gateway → 微服务
#           /*     → 静态文件 (直连)
# ============================================================

# HTTP → HTTPS 重定向
server {
  listen 80;
  server_name admin.beike.com;
  return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
  listen 443 ssl http2;
  server_name admin.beike.com;

  # SSL 证书
  ssl_certificate     /etc/nginx/certs/beike.crt;
  ssl_certificate_key /etc/nginx/certs/beike.key;

  # SSL 安全配置 (Mozilla Intermediate)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 8.8.8.8 114.114.114.114 valid=300s;

  # 安全头
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'" always;

  # 连接限制
  limit_conn conn_per_ip 20;
  limit_req zone=per_ip burst=20 nodelay;

  # 请求体大小限制
  client_max_body_size 10m;
  client_body_buffer_size 128k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;

  # 超时
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # ============================
  # 健康检查 (Prometheus)
  # ============================
  location /health {
    access_log off;
    return 200 '{"status":"ok","service":"nginx-edge-gateway"}';
    add_header Content-Type application/json;
  }

  # ============================
  # API 路由 → Spring Cloud Gateway
  # ============================
  location /api/ {
    # 限流: API 50 r/s
    limit_req zone=per_ip burst=50 nodelay;

    # WAF 防护
    modsecurity on;

    proxy_pass http://scg_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Gateway "nginx-edge";

    # 缓冲
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # 超时
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
  }

  # ============================
  # 静态文件 (直连，不经 SCG)
  # ============================
  location / {
    # 限流: 静态 20 r/s
    limit_req zone=per_ip burst=30 nodelay;

    proxy_pass http://static_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;

    # 静态资源由 upstream nginx 处理 SPA 回退
    proxy_intercept_errors off;
  }

  # ============================
  # 管理端点 (内网 IP 白名单)
  # ============================
  location /admin/ {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_pass http://scg_backend/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ============================
  # Prometheus Metrics
  # ============================
  location /metrics {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    stub_status on;
    access_log off;
  }
}

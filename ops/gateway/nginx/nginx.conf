# ============================================================
# Nginx 边缘网关 — 贝壳统一管理平台
# 职责: SSL终止 · WAF · 限流 · 安全头 · 静态文件 · 反向代理
# ============================================================
user nginx;
worker_processes auto;
worker_cpu_affinity auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

# 动态模块加载
load_module modules/ngx_http_modsecurity_module.so;

events {
  worker_connections 8192;
  use epoll;
  multi_accept on;
  accept_mutex off;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ============================
  # 日志格式 (结构化 JSON)
  # ============================
  log_format gateway_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$http_x_forwarded_for",'
    '"real_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"scheme":"$scheme",'
    '"host":"$host",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"waf_score":"$modsecurity_score",'
    '"waf_action":"$modsecurity_action"'
  '}';

  access_log /var/log/nginx/access.log gateway_json buffer=64k flush=5s;

  # ============================
  # 基础优化
  # ============================
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  server_tokens off;
  server_name_in_redirect off;
  port_in_redirect off;

  # ============================
  # 全局限流区
  # ============================
  # 基于 IP 限流: 10 r/s, burst 20
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
  # 基于 Host 限流: 100 r/s
  limit_req_zone $host zone=per_host:10m rate=100r/s;
  # 连接数限制
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  # ============================
  # WAF: ModSecurity
  # ============================
  modsecurity on;
  modsecurity_rules_file /etc/nginx/waf/modsecurity.conf;

  # ============================
  # Gzip
  # ============================
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml font/woff2;

  # ============================
  # 上游服务: Spring Cloud Gateway
  # ============================
  upstream scg_backend {
    least_conn;
    server scg-gateway:8080 max_fails=3 fail_timeout=30s;
    server scg-gateway:8081 max_fails=3 fail_timeout=30s backup;
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 500;
  }

  # 上游: 静态文件 (fallback)
  upstream static_upstream {
    server beike-web:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # ============================
  # 站点配置
  # ============================
  include /etc/nginx/conf.d/*.conf;
}

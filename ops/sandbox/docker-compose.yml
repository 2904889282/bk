name: beike-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

services:
  api:
    image: beike-platform-api:latest
    build:
      context: ../..
      dockerfile: ops/sandbox/Dockerfile.api-py
    container_name: beike-sandbox-api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    environment:
      TZ: Asia/Shanghai
      db_host: ${DB_HOST:?err: DB_HOST 必须通过 .env 文件或环境变量提供}
      db_port: ${DB_PORT:-3306}
      db_name: ${DB_NAME:-beike_platform}
      db_user: ${DB_USER:-beike}
      db_password: ${DB_PASSWORD:?err: DB_PASSWORD 必须通过 .env 文件或环境变量提供}
      jwt_secret: ${JWT_SECRET:?err: JWT_SECRET 必须通过 .env 文件或环境变量提供}
      jwt_access_expire_hours: ${JWT_ACCESS_EXPIRE_HOURS:-1}
      jwt_refresh_expire_days: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      upload_dir: /app/uploads
      log_dir: /app/logs
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/api/health\")"']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    networks:
      - beike-net

  web:
    image: beike-platform-web:latest
    build:
      context: ../..
      dockerfile: ops/sandbox/Dockerfile.web
    container_name: beike-sandbox-web
    restart: always
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health | grep -q OK']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - beike-net

volumes:
  api_uploads:
  api_logs:

networks:
  beike-net:
    driver: bridge

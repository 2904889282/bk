name: beike-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

services:
  api:
    build:
      context: ../..
      dockerfile: ops/sandbox/Dockerfile.api-py
    container_name: beike-sandbox-api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    environment:
      TZ: Asia/Shanghai
      db_host: rm-2zery46bn1074b1b1.mysql.rds.aliyuncs.com
      db_port: '3306'
      db_name: beike_platform
      db_user: beike
      db_password: BEIKEadmin123
      jwt_secret: beike-cloud-dev-jwt-secret-2026-must-be-at-least-64-characters-long-for-hs384
      jwt_access_expire_hours: '72'
      jwt_refresh_expire_days: '30'
      upload_dir: /app/uploads
      log_dir: /app/logs
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/api/health\")"']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    networks:
      - beike-net

  web:
    build:
      context: ../..
      dockerfile: ops/sandbox/Dockerfile.web
    container_name: beike-sandbox-web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health | grep -q OK']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - beike-net

volumes:
  api_uploads:
  api_logs:

networks:
  beike-net:
    driver: bridge

name: beike-sandbox

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: beike-sandbox-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-beike_platform}
      MYSQL_USER: ${MYSQL_USER:-beike_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging
    networks:
      - beike-net

  api:
    build:
      context: ../..
      dockerfile: ops/sandbox/Dockerfile.api
    container_name: beike-sandbox-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: sandbox
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-beike_platform}
      DB_USER: ${MYSQL_USER:-beike_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRE_HOURS: ${JWT_ACCESS_EXPIRE_HOURS:-2}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-30}
      BEIKE_UPLOAD_DIR: /app/uploads
      BEIKE_LOG_DIR: /app/logs
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging: *default-logging
    networks:
      - beike-net

  web:
    build:
      context: ../..
      dockerfile: ops/sandbox/Dockerfile.web
    container_name: beike-sandbox-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q 'OK'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - beike-net

volumes:
  mysql_data:
  api_uploads:
  api_logs:

networks:
  beike-net:
    driver: bridge

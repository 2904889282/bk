# ============================================================
# Logstash 管道配置 — 解析 Nginx JSON 日志 + Docker 日志
# ============================================================
input {
  beats {
    port => 5044
  }
}

filter {
  # 解析 Nginx JSON 格式日志
  if [log][file][path] =~ "nginx" {
    json {
      source => "message"
      target => "nginx"
    }
    if [nginx][time] {
      date {
        match => ["[nginx][time]", "ISO8601"]
        target => "@timestamp"
      }
    }
    mutate {
      rename => { "[nginx][status]" => "status_code" }
      rename => { "[nginx][method]" => "http_method" }
      rename => { "[nginx][uri]" => "uri" }
      rename => { "[nginx][request_time]" => "response_time" }
      rename => { "[nginx][remote_addr]" => "client_ip" }
    }
  }

  # 添加环境标签
  mutate {
    add_field => {
      "[@metadata][index]" => "beike-%{+YYYY.MM.dd}"
      "environment" => "production"
      "application" => "beike-admin"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}"
  }
  stdout {
    codec => rubydebug
  }
}

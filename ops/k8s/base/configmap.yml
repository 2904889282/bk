apiVersion: v1
kind: ConfigMap
metadata:
  name: beike-web-config
  namespace: beike-admin
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    events { worker_connections 4096; use epoll; multi_accept on; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      log_format main_json escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri","status":$status,"request_time":$request_time,"remote_addr":"$remote_addr"}';
      access_log /var/log/nginx/access.log main_json;
      sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
      gzip on; gzip_types text/plain text/css application/json application/javascript;
      server {
        listen 80;
        location /health { access_log off; return 200 "OK\n"; }
        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
        location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      }
    }

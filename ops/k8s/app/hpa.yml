apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: beike-web-hpa
  namespace: beike-admin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beike-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

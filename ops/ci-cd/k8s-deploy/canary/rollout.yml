# ============================================================
# Argo Rollouts — 金丝雀/灰度发布
# 需要: kubectl apply -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: beike-web
  namespace: beike-admin
spec:
  replicas: 4
  strategy:
    canary:
      # 分步放量: 10% → 30% → 60% → 100%
      steps:
        - setWeight: 10
        - pause: { duration: 120s }    # 观察 2 分钟
        - setWeight: 30
        - pause: { duration: 180s }    # 观察 3 分钟
        - setWeight: 60
        - pause: { duration: 300s }    # 观察 5 分钟
        - setWeight: 100
      # 自动回滚条件 (Prometheus 指标)
      analysis:
        templates:
          - templateName: beike-canary-analysis
        startingStep: 1               # 从第 2 步开始分析
  selector:
    matchLabels:
      app: beike-web
  template:
    metadata:
      labels:
        app: beike-web
    spec:
      containers:
        - name: beike-web
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 80 }]
          env:
            - name: APP_VERSION
              value: "v4.0.0"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:  { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 5 }
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 3 }
---
# ============================
# Canary Analysis (自动回滚)
# ============================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: beike-canary-analysis
  namespace: beike-admin
spec:
  metrics:
    # 1. HTTP 错误率 < 1%
    - name: error-rate
      interval: 30s
      count: 6
      failureCondition: result >= 0.01
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(nginx_http_requests_total{app="beike-web",status=~"5.."}[1m]))
            /
            sum(rate(nginx_http_requests_total{app="beike-web"}[1m]))
    # 2. P95 延迟 < 2s
    - name: p95-latency
      interval: 30s
      count: 6
      failureCondition: result >= 2
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            histogram_quantile(0.95,
              sum(rate(nginx_http_request_duration_seconds_bucket{app="beike-web"}[5m])) by (le))
    # 3. 健康检查
    - name: health
      interval: 15s
      count: 4
      failureCondition: result < 1
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(up{job="beike-web"})
---
# ============================
# Service
# ============================
apiVersion: v1
kind: Service
metadata:
  name: beike-web
  namespace: beike-admin
spec:
  selector:
    app: beike-web
  ports:
    - port: 80
      targetPort: 80

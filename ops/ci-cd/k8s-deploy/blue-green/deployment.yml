# ============================================================
# Kubernetes 蓝绿部署 — 贝壳管理平台
# ============================================================

# --- 蓝色 (当前版本) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beike-web-blue
  namespace: beike-admin
  labels:
    app: beike-web
    version: blue
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beike-web
      version: blue
  template:
    metadata:
      labels:
        app: beike-web
        version: blue
    spec:
      containers:
        - name: beike-web
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:  { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
---
# --- 绿色 (新版本) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beike-web-green
  namespace: beike-admin
  labels:
    app: beike-web
    version: green
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beike-web
      version: green
  template:
    metadata:
      labels:
        app: beike-web
        version: green
    spec:
      containers:
        - name: beike-web
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:  { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
---
# --- Service (流量切换) ---
apiVersion: v1
kind: Service
metadata:
  name: beike-web
  namespace: beike-admin
spec:
  type: ClusterIP
  selector:
    app: beike-web
    version: blue        # 初始指向蓝色, CI 脚本自动切换
  ports:
    - name: http
      port: 80
      targetPort: 80

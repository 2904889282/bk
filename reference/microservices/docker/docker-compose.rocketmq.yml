# ============================================================
# RocketMQ + Dashboard docker-compose 扩展
# 叠加: docker compose -f docker-compose.data.yml -f docker/docker-compose.rocketmq.yml up -d
# ============================================================
version: "3.9"

services:
  # ============================
  # RocketMQ NameServer
  # ============================
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: beike-rocketmq-namesrv
    environment:
      - JAVA_OPT_EXT=-Xms256m -Xmx256m -Xmn128m
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - rocketmq_ns_data:/home/rocketmq/logs
    restart: unless-stopped
    networks:
      - beike-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9876/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================
  # RocketMQ Broker
  # ============================
  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: beike-rocketmq-broker
    environment:
      - JAVA_OPT_EXT=-Xms512m -Xmx512m -Xmn256m
    command: sh mqbroker -c /home/rocketmq/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./rocketmq/broker/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq_broker_data:/home/rocketmq/store
    restart: unless-stopped
    networks:
      - beike-net
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy

  # ============================
  # RocketMQ Dashboard
  # ============================
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.1
    container_name: beike-rocketmq-dashboard
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    ports:
      - "8180:8080"
    restart: unless-stopped
    networks:
      - beike-net
    depends_on:
      - rocketmq-namesrv

volumes:
  rocketmq_ns_data:
  rocketmq_broker_data:

networks:
  beike-net:
    external: true

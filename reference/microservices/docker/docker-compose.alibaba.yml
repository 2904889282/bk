version: "3.9"
services:
  # ============================
  # Nacos 注册+配置中心 (单机模式)
  # ============================
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: beike-nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    restart: unless-stopped
    networks:
      - beike-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================
  # Sentinel Dashboard 控制台
  # ============================
  sentinel:
    image: bladex/sentinel-dashboard:1.8.7
    container_name: beike-sentinel
    environment:
      - SERVER_PORT=8090
      - SENTINEL_DASHBOARD_AUTH_USERNAME=sentinel
      - SENTINEL_DASHBOARD_AUTH_PASSWORD=sentinel123
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE=beike-prod
    ports:
      - "8090:8090"
    restart: unless-stopped
    networks:
      - beike-net
    depends_on:
      - nacos

  # ============================
  # Seata 分布式事务服务 (TC)
  # ============================
  seata:
    image: seataio/seata-server:2.1.0
    container_name: beike-seata
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=db
      - STORE_DB_DRIVERCLASSNAME=com.mysql.cj.jdbc.Driver
      - STORE_DB_URL=jdbc:mysql://mysql:3306/seata?useUnicode=true
      - STORE_DB_USER=root
      - STORE_DB_PASSWORD=root123
    ports:
      - "8091:8091"
    volumes:
      - ./seata/application.yml:/seata-server/resources/application.yml:ro
    restart: unless-stopped
    networks:
      - beike-net
    depends_on:
      - nacos

  # ============================
  # MySQL 8 (微服务数据库)
  # ============================
  mysql:
    image: mysql:8.3.0
    container_name: beike-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=beike_admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    restart: unless-stopped
    networks:
      - beike-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nacos_data:
  mysql_data:

networks:
  beike-net:
    external: true

# ============================================================
# 贝壳管理系统 · 生产环境配置
# 使用方式：java -jar app.jar --spring.profiles.active=prod
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/beike_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: beike_app                          # ⚠️ 上线前改为专用账号，不要用 root
    password: ${DB_PASSWORD:ChangeMe!2026}       # ⚠️ 通过环境变量注入，不要硬编码
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  web:
    resources:
      static-locations: classpath:/static/,file:./uploads

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.beike.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产环境关闭 SQL 日志
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080
  # 生产环境建议加 compression
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# 贝壳自定义配置
beike:
  upload:
    dir: /opt/beike-app/uploads              # 绝对路径
  jwt:
    secret: ${JWT_SECRET:ProdSecret-ChangeMe-To-Random-64Chars-Minimum!!}
    expire-hours: 24

logging:
  level:
    com.beike: info                           # 生产用 info，不要 debug
    org.springframework: warn
  file:
    path: /opt/beike-app/logs
    name: /opt/beike-app/logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30

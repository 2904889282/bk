# ============================================================
# Grafana 配置
# ============================================================
[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[auth.anonymous]
enabled = false

[security]
admin_user = admin
admin_password = admin123

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/beike-overview.json

# ============================================================
# Prometheus 配置 — 贝壳统一管理平台
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: beike-admin
    env: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # 1. Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # 2. 应用服务 (Nginx → 需 nginx-prometheus-exporter sidecar)
  - job_name: beike-web
    metrics_path: /metrics
    static_configs:
      - targets:
          - beike-web:9113
        labels:
          app: beike-web
          service: frontend

  # 3. SkyWalking OAP 自监控
  - job_name: skywalking
    metrics_path: /metrics
    static_configs:
      - targets:
          - skywalking-oap:1234
        labels:
          app: skywalking
          service: apm

  # 4. Node Exporter (每台主机)
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: infrastructure

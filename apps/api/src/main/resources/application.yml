spring:
  application:
    name: beike-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/beike_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  web:
    resources:
      static-locations: classpath:/static/,file:./uploads

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.beike.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

beike:
  upload:
    dir: ./uploads
  wechat:
    app-id: ""
    app-secret: ""
    redirect-uri: "http://localhost:5173/login"

logging:
  level:
    com.beike: debug

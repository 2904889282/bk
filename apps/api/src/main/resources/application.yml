spring:
  application:
    name: beike-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/beike_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&createDatabaseIfNotExist=true
    username: root
    password: root
  sql:
    init:
      mode: never  # 生产安全：禁止自动执行 DDL。首次部署前手动执行 schema.sql
      schema-locations: classpath:schema.sql
      continue-on-error: true
  jackson:
    date-format: yyyy-MM-dd
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.beike.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

beike:
  upload:
    dir: ./uploads

logging:
  level:
    com.beike: debug

# ============================================================
# MinIO 对象存储 — 贝壳管理平台
# 叠加: docker compose -f docker-compose.data.yml -f docker/docker-compose.storage.yml up -d
# ============================================================
version: "3.9"

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: beike-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=beike_admin
      - MINIO_ROOT_PASSWORD=beike_minio_2024
      - MINIO_BROWSER_REDIRECT_URL=
    ports:
      - "9000:9000"     # API (S3 兼容)
      - "9001:9001"     # Web Console
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - beike-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 自动创建 Bucket
  minio-init:
    image: minio/mc:latest
    container_name: beike-minio-init
    entrypoint: /bin/sh -c "
      until mc alias set beike http://minio:9000 beike_admin beike_minio_2024; do sleep 2; done;
      mc mb --ignore-existing beike/beike-files;
      mc mb --ignore-existing beike/beike-exports;
      mc policy set download beike/beike-files;
      echo 'MinIO ready';
      exit 0;
    "
    networks:
      - beike-net
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:

networks:
  beike-net:
    external: true

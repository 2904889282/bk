version: "3.9"

services:
  # ============================
  # MySQL 主库 (读写)
  # ============================
  mysql-master:
    image: mysql:8.3.0
    container_name: beike-mysql-master
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=beike_admin
      - MYSQL_USER=replica
      - MYSQL_PASSWORD=replica_pass_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./mysql-master/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql-master/init-user.sql:/docker-entrypoint-initdb.d/02-replica-user.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    networks:
      - beike-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================
  # MySQL 从库 (只读)
  # ============================
  mysql-slave:
    image: mysql:8.3.0
    container_name: beike-mysql-slave
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=beike_admin
    ports:
      - "3307:3306"
    volumes:
      - mysql_slave_data:/var/lib/mysql
      - ./mysql-slave/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    networks:
      - beike-net
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================
  # Redis 7 缓存
  # ============================
  redis:
    image: redis:7.4-alpine
    container_name: beike-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - beike-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    sysctls:
      - net.core.somaxconn=1024

  # ============================
  # Redis Sentinel (哨兵-高可用)
  # ============================
  redis-sentinel:
    image: redis:7.4-alpine
    container_name: beike-redis-sentinel
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    restart: unless-stopped
    networks:
      - beike-net
    depends_on:
      redis:
        condition: service_healthy

  # ============================
  # Elasticsearch 8 (搜索)
  # ============================
  elasticsearch:
    build:
      context: ..
      dockerfile: docker/elasticsearch/Dockerfile
    container_name: beike-elasticsearch
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    restart: unless-stopped
    networks:
      - beike-net
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_master_data:
  mysql_slave_data:
  redis_data:
  es_data:

networks:
  beike-net:
    external: true

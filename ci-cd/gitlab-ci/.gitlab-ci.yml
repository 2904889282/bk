# ============================================================
# GitLab CI/CD Pipeline — 贝壳管理平台
# ============================================================
stages:
  - lint
  - test
  - build
  - security-scan
  - push
  - deploy-staging
  - deploy-prod

variables:
  DOCKER_REGISTRY: harbor.beike.com
  DOCKER_IMAGE: ${DOCKER_REGISTRY}/beike-admin
  KUBE_NAMESPACE: beike-admin
  SONAR_HOST: https://sonarqube.beike.com

# ============================
# 1. Lint & Type Check
# ============================
lint:
  stage: lint
  image: node:22-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules, .pnpm-store]
  script:
    - corepack enable && pnpm install --frozen-lockfile
    - pnpm run lint || true
    - npx tsc --noEmit
  only: [merge_requests, main, develop]

# ============================
# 2. Backend Compile & Test
# ============================
backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths: [.m2]
  script:
    - cd backend
    - mvn clean compile -DskipTests
    - mvn test -Dspring.profiles.active=test
  artifacts:
    reports:
      junit: backend/**/target/surefire-reports/*.xml
  only: [merge_requests, main, develop]

# ============================
# 3. Build Docker Image
# ============================
build:
  stage: build
  image: docker:27-dind
  services: [docker:27-dind]
  before_script:
    - echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USER}" --password-stdin ${DOCKER_REGISTRY}
  script:
    - |
      docker build \
        --build-arg VITE_APP_VERSION=${CI_COMMIT_SHORT_SHA} \
        -t ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        -t ${DOCKER_IMAGE}:latest \
        -f docker/Dockerfile .
    - docker push ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${DOCKER_IMAGE}:latest
  only: [main, develop, tags]

# ============================
# 4. Security Scan (Trivy)
# ============================
security-scan:
  stage: security-scan
  image: aquasec/trivy:latest
  script:
    - trivy image --severity HIGH,CRITICAL --no-progress ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}
  allow_failure: true
  only: [main]

# ============================
# 5. Deploy Staging (蓝绿)
# ============================
deploy-staging:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: https://staging.beike.com
  script:
    - kubectl config use-context staging-cluster
    - |
      # 蓝绿部署
      ACTIVE=$(kubectl get svc beike-web -n ${KUBE_NAMESPACE} -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")
      if [ "$ACTIVE" = "blue" ]; then NEW="green"; else NEW="blue"; fi
      echo "Active: $ACTIVE → Deploy: $NEW"
      # 部署新版本
      cat k8s/app/deployment.yml | sed "s|beike-admin:latest|${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}|g" | \
        sed "s|version: v4.0.0|version: ${NEW}|g" | kubectl apply -n ${KUBE_NAMESPACE} -f -
      # 等待 Ready
      kubectl rollout status deployment/beike-web-${NEW} -n ${KUBE_NAMESPACE} --timeout=5m
      # 切换流量
      kubectl patch svc beike-web -n ${KUBE_NAMESPACE} -p "{\"spec\":{\"selector\":{\"app\":\"beike-web\",\"version\":\"${NEW}\"}}}"
      echo "Blue-Green: switched to $NEW"
  only: [main, develop]

# ============================
# 6. Canary Deployment to Prod
# ============================
deploy-prod-canary:
  stage: deploy-prod
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://admin.beike.com
  script:
    - kubectl config use-context prod-cluster
    # 阶段 1: Canary 10%
    - |
      cat ci-cd/k8s-deploy/canary/rollout.yml | \
        sed "s|IMAGE_PLACEHOLDER|${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}|g" | \
        kubectl apply -n ${KUBE_NAMESPACE} -f -
    # 阶段 2: 监控 5 分钟 (Prometheus 告警)
    - sleep 300
    # 阶段 3: 逐步放量
    - kubectl argo rollouts promote beike-web -n ${KUBE_NAMESPACE} || echo "等待手动审批"
    - kubectl argo rollouts status beike-web -n ${KUBE_NAMESPACE} --timeout=15m
  only: [main]
  when: manual   # 生产发布需手动触发

# ============================
# 7. Rollback
# ============================
rollback:
  stage: deploy-prod
  image: bitnami/kubectl:latest
  script:
    - kubectl config use-context prod-cluster
    - kubectl argo rollouts undo beike-web -n ${KUBE_NAMESPACE}
  when: manual
  only: [main]

# ============================================================
# 贝壳统一管理平台 — 全栈 docker-compose (本地开发/测试)
# ============================================================
# 启动: docker compose -f docker/docker-compose.yml up -d
# 停止: docker compose -f docker/docker-compose.yml down
# ============================================================

version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
    tag: "beike-{{.Name}}"

services:
  # ============================
  # 1. 应用服务
  # ============================
  beike-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: beike-web
    ports:
      - "8080:80"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - beike-net
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=80"

  # ============================
  # 2. Prometheus — 指标采集
  # ============================
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: beike-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - beike-net

  # ============================
  # 3. Grafana — 可视化面板
  # ============================
  grafana:
    image: grafana/grafana:11.7.0
    container_name: beike-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    logging: *default-logging
    networks:
      - beike-net
    depends_on:
      - prometheus

  # ============================
  # 4. Elasticsearch — 日志存储
  # ============================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: beike-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - beike-net
    ulimits:
      memlock: { soft: -1, hard: -1 }

  # ============================
  # 5. Logstash — 日志管道
  # ============================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: beike-logstash
    ports:
      - "5044:5044"
    volumes:
      - ../logging/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ../logging/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    restart: unless-stopped
    logging: *default-logging
    networks:
      - beike-net
    depends_on:
      - elasticsearch

  # ============================
  # 6. Kibana — 日志可视化
  # ============================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: beike-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    restart: unless-stopped
    logging: *default-logging
    networks:
      - beike-net
    depends_on:
      - elasticsearch

  # ============================
  # 7. Filebeat — 日志采集
  # ============================
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    container_name: beike-filebeat
    user: root
    volumes:
      - ../logging/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging: *default-logging
    networks:
      - beike-net
    depends_on:
      - logstash

  # ============================
  # 8. SkyWalking OAP — APM 后端
  # ============================
  skywalking-oap:
    image: apache/skywalking-oap-server:10.1.0
    container_name: beike-skywalking-oap
    environment:
      - SW_STORAGE=elasticsearch
      - SW_STORAGE_ES_CLUSTER_NODES=elasticsearch:9200
      - SW_HEALTH_CHECKER=default
      - SW_TELEMETRY=prometheus
    ports:
      - "11800:11800"   # gRPC
      - "12800:12800"   # HTTP
    restart: unless-stopped
    logging: *default-logging
    networks:
      - beike-net
    depends_on:
      - elasticsearch

  # ============================
  # 9. SkyWalking UI — APM 面板
  # ============================
  skywalking-ui:
    image: apache/skywalking-ui:10.1.0
    container_name: beike-skywalking-ui
    environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800
    ports:
      - "8081:8080"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - beike-net
    depends_on:
      - skywalking-oap

volumes:
  prometheus_data:
  grafana_data:
  es_data:

networks:
  beike-net:
    driver: bridge
